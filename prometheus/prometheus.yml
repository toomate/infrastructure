global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]

  - job_name: microservico-notif
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["microservico-notif:8182"]

  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
